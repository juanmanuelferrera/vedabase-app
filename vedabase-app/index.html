        // ========== Search ==========
        function performSearch(query) {
            if (!query || query.trim().length < 2) {
                showSnackbar('Enter at least 2 characters');
                return;
            }
            query = query.trim();
            let normalizedQuery = stripDiacritics(query);
            currentSearchQuery = normalizedQuery.toLowerCase();
            currentIgnoreDiacritics = true;

            const queryForSearch = normalizedQuery.toLowerCase();

            // Parse boolean operators
            let booleanMode = null;
            let booleanTerms = [];

            const prefixPlusMatch = queryForSearch.match(/^\+\S/);
            if (prefixPlusMatch) {
                booleanMode = 'AND';
                booleanTerms = queryForSearch.split(/\s+/).map(t => t.replace(/^\+/, '').trim()).filter(t => t.length > 0);
            } else if (queryForSearch.includes(' + ')) {
                booleanMode = 'AND';
                booleanTerms = queryForSearch.split(' + ').map(t => t.trim()).filter(t => t.length > 0);
            } else if (/ or /i.test(query)) {
                booleanMode = 'OR';
                booleanTerms = queryForSearch.split(/ or /i).map(t => t.trim()).filter(t => t.length > 0);
            }

            const results = [];
            const filesToSearch = searchAll ? Object.keys(bookNames) : [currentSrc];
            const MAX_RESULTS_PER_FILE = 50;
            const MAX_TOTAL_RESULTS = 200;

            // Show loading state
            searchResultsEl.innerHTML = '<div style="padding:24px;text-align:center"><div class="spinner" style="margin:0 auto"></div><p style="margin-top:12px;font-size:13px;color:var(--text-secondary)">Searching...</p></div>';
            searchResultsEl.classList.add('visible');
            contentFrame.style.display = 'none';

            let processedFiles = 0;
            let totalResults = 0;

            filesToSearch.forEach((src, index) => {
                setTimeout(() => {
                    if (totalResults >= MAX_TOTAL_RESULTS) {
                        processedFiles++;
                        if (processedFiles === filesToSearch.length) displayResults(results, query);
                        return;
                    }

                    fetch(src)
                        .then(r => r.text())
                        .then(html => {
                            const regexFlags = 'gi';

                            let searchRegex;
                            let booleanRegexes = [];

                            if (booleanMode) {
                                booleanRegexes = booleanTerms.map(term => {
                                    const escaped = escapeRegex(term);
                                    return new RegExp(escaped, regexFlags);
                                });
                                const combined = booleanTerms.map(t => escapeRegex(t)).join('|');
                                searchRegex = new RegExp(combined, regexFlags);
                            } else {
                                const escapedQuery = escapeRegex(queryForSearch);
                                searchRegex = new RegExp(escapedQuery, regexFlags);
                            }

                            const contentStart = html.indexOf('<div id="content"');
                            if (contentStart === -1) { processedFiles++; if (processedFiles === filesToSearch.length) displayResults(results, query); return; }
                            const contentBodyStart = html.indexOf('>', contentStart) + 1;
                            let contentEnd = html.indexOf('<div id="postamble"', contentBodyStart);
                            if (contentEnd === -1) contentEnd = html.indexOf('</body>', contentBodyStart);
                            if (contentEnd === -1) contentEnd = html.length;
                            const content = html.substring(contentBodyStart, contentEnd);

                            const elementRegex = /<(p|h[1-6])[^>]*>([\s\S]*?)<\/\1>/gi;
                            let match;
                            let fileResults = 0;

                            while ((match = elementRegex.exec(content)) !== null && fileResults < MAX_RESULTS_PER_FILE && totalResults < MAX_TOTAL_RESULTS) {
                                const text = match[2].replace(/<[^>]+>/g, '').replace(/&[^;]+;/g, ' ');
                                let textToSearch = stripDiacritics(text.toLowerCase());

                                let hasMatch;
                                if (booleanMode === 'AND') {
                                    hasMatch = booleanRegexes.every(rx => { rx.lastIndex = 0; return rx.test(textToSearch); });
                                } else if (booleanMode === 'OR') {
                                    hasMatch = booleanRegexes.some(rx => { rx.lastIndex = 0; return rx.test(textToSearch); });
                                } else {
                                    hasMatch = textToSearch.includes(queryForSearch);
                                }

                                searchRegex.lastIndex = 0;

                                if (hasMatch) {
                                    const matchResult = searchRegex.exec(textToSearch);
                                    const idx = matchResult ? matchResult.index : 0;

                                    const start = Math.max(0, idx - 100);
                                    const end = Math.min(text.length, idx + 100);
                                    let excerpt = text.substring(start, end).trim();
                                    if (start > 0) excerpt = '...' + excerpt;
                                    if (end < text.length) excerpt = excerpt + '...';

                                    searchRegex.lastIndex = 0;
                                    excerpt = excerpt.replace(searchRegex, '<span class="search-highlight">$&</span>');

                                    // Get heading context
                                    const precedingContent = content.substring(0, match.index);
                                    const headingRegex = /<(h[2-6])[^>]*id="([^"]*)"[^>]*>([^<]+)<\/\1>/g;
                                    const headings = [];
                                    let headingMatch;
                                    while ((headingMatch = headingRegex.exec(precedingContent)) !== null) {
                                        headings.push({
                                            level: parseInt(headingMatch[1].substring(1)),
                                            id: headingMatch[2],
                                            text: headingMatch[3].replace(/&[^;]+;/g, ' ').trim()
                                        });
                                    }

                                    let heading = 'Introduction';
                                    let headingId = '';
                                    if (headings.length > 0) {
                                        const lastHeading = headings[headings.length - 1];
                                        headingId = lastHeading.id;
                                        const hierarchy = [lastHeading.text];
                                        let currentLevel = lastHeading.level;
                                        for (let i = headings.length - 2; i >= 0; i--) {
                                            if (headings[i].level < currentLevel) {
                                                hierarchy.unshift(headings[i].text);
                                                currentLevel = headings[i].level;
                                                if (hierarchy.length >= 3) break;
                                            }
                                        }
                                        heading = hierarchy.join(' → ').substring(0, 200);
                                    }

                                    results.push({
                                        source: bookNames[src],
                                        sourcePath: src,
                                        heading, excerpt, headingId,
                                        occurrenceIndex: fileResults + 1
                                    });

                                    fileResults++;
                                    totalResults++;
                                }
                            }

                            processedFiles++;
                            if (processedFiles === filesToSearch.length || totalResults >= MAX_TOTAL_RESULTS) {
                                displayResults(results, query);
                            }
                        })
                        .catch(() => {
                            processedFiles++;
                            if (processedFiles === filesToSearch.length) displayResults(results, query);
                        });
                }, index * 50);
            });
        }

        function displayResults(results, query) {
            if (results.length === 0) {
                searchResultsEl.innerHTML = `
                    <div style="padding:32px;text-align:center">
                        <p style="font-size:14px;color:var(--text-secondary)">No results found for "${query}"</p>
                        <button onclick="window._closeSearch()" class="btn-accent" style="margin-top:12px;padding:6px 16px;border-radius:4px">Close</button>
                    </div>`;
                return;
            }

            let html = `
                <div class="search-results-header">
                    <h3>${results.length} result${results.length > 1 ? 's' : ''} for "${query}"</h3>
                    <div class="search-results-actions">
                        <button class="btn-secondary" onclick="window._exportResults()"><i class="fa-solid fa-download"></i> Export</button>
                        <button class="btn-accent" onclick="window._closeSearch()">Close</button>
                    </div>
                </div>
                <div class="search-filter-bar">
                    <input type="text" id="filter-results-input" placeholder="Filter these results...">
                    <button class="btn-secondary" onclick="window._filterResults()"><i class="fa-solid fa-filter"></i></button>
                    <button class="btn-secondary" id="clear-filter-btn" style="display:none" onclick="window._clearFilter()"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="search-results-list">`;

            results.forEach((r, i) => {
                html += `
                    <div class="search-result-item" data-source-path="${r.sourcePath}" data-heading-id="${r.headingId}" data-occurrence="${r.occurrenceIndex}" data-result-index="${i}">
                        <div class="search-source">${r.source}</div>
                        <div class="search-heading">${r.heading}</div>
                        <div class="search-excerpt">${r.excerpt}</div>
                    </div>`;
            });

            html += '</div>';
            searchResultsEl.innerHTML = html;

            allSearchResults = results;
            unfilteredSearchResults = results;
            currentSearchOriginalQuery = query;


            // Filter input enter key
            const filterInput = document.getElementById('filter-results-input');
            if (filterInput) {
                filterInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') window._filterResults();
                });
            }

            // Result click handler
            searchResultsEl.querySelectorAll('.search-result-item').forEach(item => {
                item.addEventListener('click', () => {
                    const sp = item.dataset.sourcePath;
                    const hi = item.dataset.headingId;
                    const occ = parseInt(item.dataset.occurrence);
                    const ri = parseInt(item.dataset.resultIndex);
                    openResult(sp, hi, allSearchResults[ri]?.heading || '', occ, ri);
                });
            });
        }

        window._closeSearch = function() {
            searchResultsEl.classList.remove('visible');
            contentFrame.style.display = '';
            allSearchResults = [];
            unfilteredSearchResults = [];
            currentSearchOriginalQuery = '';

            currentSearchQuery = '';

            try { removeHighlights(contentFrame.contentWindow.document); } catch (e) {}
        };

        window._filterResults = function() {
            const filterInput = document.getElementById('filter-results-input');
            const filterTerm = filterInput ? filterInput.value.trim().toLowerCase() : '';
            if (!filterTerm || filterTerm.length < 2) { showSnackbar('Enter at least 2 characters to filter'); return; }

            const filtered = unfilteredSearchResults.filter(r =>
                r.excerpt.toLowerCase().includes(filterTerm) ||
                r.heading.toLowerCase().includes(filterTerm) ||
                r.source.toLowerCase().includes(filterTerm)
            );

            displayResults(filtered, `${currentSearchOriginalQuery}" filtered by "${filterTerm}`);
            const clearBtn = document.getElementById('clear-filter-btn');
            if (clearBtn) clearBtn.style.display = '';
        };

        window._clearFilter = function() {
            const filterInput = document.getElementById('filter-results-input');
            if (filterInput) filterInput.value = '';
            displayResults(unfilteredSearchResults, currentSearchOriginalQuery);
            const clearBtn = document.getElementById('clear-filter-btn');
            if (clearBtn) clearBtn.style.display = 'none';
        };

        window._exportResults = function() {
            if (allSearchResults.length === 0) return;
            const query = searchInput.value.trim();
            const timestamp = new Date().toLocaleString();
            let text = `VEDABASE SEARCH RESULTS\n=========================\n\nSearch Query: "${query}"\nTotal Results: ${allSearchResults.length}\nDate: ${timestamp}\n\n=========================\n\n`;
            allSearchResults.forEach((r, i) => {
                const plain = r.excerpt.replace(/<[^>]+>/g, '').replace(/&[^;]+;/g, ' ');
                text += `[Result ${i + 1}]\nSource: ${r.source}\nLocation: ${r.heading}\n\n${plain}\n\n${'='.repeat(50)}\n\n`;
            });
            const blob = new Blob([text], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `vedabase-search-${query.replace(/[^a-z0-9]/gi, '_')}-${Date.now()}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        };

        // Search event handlers
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') performSearch(searchInput.value);
        });

        // ========== Apply search highlights to loaded frame ==========
        function applySearchToLoadedFrame() {
            if (!currentSearchQuery) return;
            setTimeout(() => {
                try {
                    const iframeDoc = contentFrame.contentWindow.document;
                    const content = iframeDoc.getElementById('content');
                    if (!content) return;

                    removeHighlights(iframeDoc);

                    const escapedQuery = escapeRegex(currentSearchQuery);
                    const regex = new RegExp(`(${escapedQuery})`, 'gi');

                    const walker = iframeDoc.createTreeWalker(content, NodeFilter.SHOW_TEXT, null, false);
                    const nodesToReplace = [];
                    let node;
                    while (node = walker.nextNode()) {
                        const testText = currentIgnoreDiacritics ? stripDiacritics(node.textContent) : node.textContent;
                        if (testText.match(regex)) nodesToReplace.push(node);
                    }
                    nodesToReplace.forEach(textNode => {
                        const span = iframeDoc.createElement('span');
                        span.innerHTML = textNode.textContent.replace(regex, '<mark class="search-term-highlight" style="background:#fef08a;padding:2px 4px;border-radius:2px;font-weight:600;">$1</mark>');
                        textNode.parentNode.replaceChild(span, textNode);
                    });
                } catch (e) {}
            }, 500);
        }

        // ========== Open Result ==========
        function openResult(sourcePath, headingId, displayHeading, occurrenceIndex, resultIndex) {
            searchResultsEl.classList.remove('visible');
            contentFrame.style.display = '';

            currentHeadingId = headingId;
            currentOccurrenceIndex = occurrenceIndex;

            const highlightAndScroll = () => {
                try {
                    const iframeDoc = contentFrame.contentWindow.document;
                    let targetElement = null;

                    if (currentSearchQuery && currentOccurrenceIndex) {
                        const escapedQuery = escapeRegex(currentSearchQuery);
                        const regex = new RegExp(escapedQuery, 'i');
                        const content = iframeDoc.getElementById('content');
                        if (content) {
                            const elements = content.querySelectorAll('p, h1, h2, h3, h4, h5, h6');
                            let foundOccurrence = 0;
                            for (let el of elements) {
                                if (regex.test(el.textContent)) {
                                    foundOccurrence++;
                                    if (foundOccurrence === currentOccurrenceIndex) {
                                        targetElement = el;
                                        break;
                                    }
                                }
                            }
                        }
                    }

                    if (!targetElement && currentHeadingId) {
                        targetElement = iframeDoc.getElementById(currentHeadingId);
                    }

                    removeHighlights(iframeDoc);

                    setTimeout(() => {
                        if (currentSearchQuery) {
                            const escapedQuery = escapeRegex(currentSearchQuery);
                            const regex = new RegExp(`(${escapedQuery})`, 'gi');
                            const content = iframeDoc.getElementById('content');
                            if (content) {
                                const searchStart = targetElement?.parentElement || content;
                                const walker = iframeDoc.createTreeWalker(searchStart, NodeFilter.SHOW_TEXT, null, false);
                                const nodesToReplace = [];
                                let node;
                                while (node = walker.nextNode()) {
                                    if (node.textContent.match(regex)) nodesToReplace.push(node);
                                }
                                nodesToReplace.forEach(textNode => {
                                    const span = iframeDoc.createElement('span');
                                    span.innerHTML = textNode.textContent.replace(regex, '<mark class="search-term-highlight" style="background:#fef08a;padding:2px 4px;border-radius:2px;font-weight:600;">$1</mark>');
                                    textNode.parentNode.replaceChild(span, textNode);
                                });

                                setTimeout(() => {
                                    if (targetElement) {
                                        targetElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
                                        expandTOCToElement(iframeDoc, currentHeadingId);
                                    } else {
                                        const firstHighlight = iframeDoc.querySelector('.search-term-highlight');
                                        if (firstHighlight) firstHighlight.scrollIntoView({ behavior: 'smooth', block: 'center' });
                                    }
                                }, 100);
                            }
                        } else if (targetElement) {
                            targetElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
                        }
                    }, 300);
                } catch (e) {}
            };

            if (sourcePath !== currentSrc) {
                // Switch books then highlight
                currentSrc = sourcePath;
                isLoading = true;
                loadingEl.classList.add('visible');
                contentFrame.style.display = 'none';

                // Update sidebar active state
                document.querySelectorAll('.sidebar-item.active, .sidebar-subitem.active').forEach(el => el.classList.remove('active'));
                const targetEl = document.querySelector(`[data-src="${sourcePath}"]`);
                if (targetEl) targetEl.classList.add('active');

                contentFrame.onload = function() {
                    const waitForDOM = () => {
                        try {
                            const iframeDoc = contentFrame.contentWindow.document;
                            const content = iframeDoc.getElementById('content');
                            if (!content || content.querySelectorAll('p, h1, h2, h3, h4, h5, h6').length === 0) {
                                setTimeout(waitForDOM, 200);
                                return;
                            }
                            setTimeout(() => {
                                loadingEl.classList.remove('visible');
                                contentFrame.style.display = '';
                                contentFrame.offsetHeight;
                                isLoading = false;
                                loadedPages.add(sourcePath);
                                setTimeout(highlightAndScroll, 1000);
                            }, 2000);
                        } catch (e) { setTimeout(waitForDOM, 200); }
                    };
                    setTimeout(waitForDOM, 300);
                };
                contentFrame.src = sourcePath;
            } else {
                highlightAndScroll();
            }
        }

        // ========== TOC Helpers ==========
        function expandTOCToElement(doc, headingId) {
            if (!headingId) return;
            try {
                const toc = doc.getElementById('text-table-of-contents');
                if (!toc) return;
                const tocLink = toc.querySelector(`a[href="#${headingId}"]`);
                if (!tocLink) return;

                let tocItem = tocLink.parentElement;
                if (!tocItem || tocItem.tagName !== 'LI') return;

                toc.querySelectorAll('li.expanded').forEach(i => i.classList.remove('expanded'));
                toc.querySelectorAll('a.toc-active').forEach(l => l.classList.remove('toc-active'));

                let currentItem = tocItem;
                while (currentItem && currentItem.tagName === 'LI') {
                    currentItem.classList.add('expanded');
                    const parentUL = currentItem.parentElement;
                    if (parentUL && parentUL.tagName === 'UL') currentItem = parentUL.parentElement;
                    else break;
                }

                tocLink.classList.add('toc-active');
                setTimeout(() => tocLink.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 200);
            } catch (e) {}
        }

        // ========== Cross-file TOC navigation ==========
        contentFrame.addEventListener('load', () => {
            setTimeout(() => {
                try {
                    const iframeDoc = contentFrame.contentWindow.document;
                    const toc = iframeDoc.getElementById('text-table-of-contents');
                    if (!toc) return;

                    toc.addEventListener('click', async (e) => {
                        const link = e.target.closest('a');
                        if (!link || !link.hash) return;
                        const targetId = link.hash.substring(1);
                        const targetElement = iframeDoc.getElementById(targetId);
                        if (!targetElement) {
                            e.preventDefault();
                            e.stopPropagation();
                            const targetFile = await findFileForHeading(targetId);
                            if (targetFile && targetFile !== currentSrc) {
                                currentHeadingId = targetId;
                                openResult(targetFile, targetId, '', null);
                            }
                        }
                    }, true);
                } catch (e) {}
            }, 500);
        });

        async function findFileForHeading(headingId) {
            const fileGroups = {
                sb: ['vedabase-source/sb1.html', 'vedabase-source/sb2.html', 'vedabase-source/sb3.html'],
                cc: ['vedabase-source/cc1.html', 'vedabase-source/cc2.html', 'vedabase-source/cc3.html']
            };

            for (const [prefix, files] of Object.entries(fileGroups)) {
                if (currentSrc.includes(prefix)) {
                    for (const file of files) {
                        if (file === currentSrc) continue;
                        try {
                            const response = await fetch(file);
                            const text = await response.text();
                            if (text.includes(`id="${headingId}"`)) return file;
                        } catch (e) {}
                    }
                    const currentIndex = files.indexOf(currentSrc);
                    if (currentIndex >= 0 && currentIndex < files.length - 1) return files[currentIndex + 1];
                    return files[0];
                }
            }
            return null;
        }

        // ========== Reading Progress ==========
        let lastSavedScroll = -1;
        function saveReadingProgress() {
            try {
                const iframeDoc = contentFrame.contentWindow.document;
                const scrollY = iframeDoc.documentElement.scrollTop || iframeDoc.body.scrollTop;
                if (scrollY === lastSavedScroll) return;
                lastSavedScroll = scrollY;
                localStorage.setItem(`readingProgress_${currentSrc}`, JSON.stringify({
                    sourcePath: currentSrc,
                    scrollPosition: scrollY,
                    timestamp: Date.now()
                }));
            } catch (e) {}
        }

        function loadReadingProgress() {
            try {
                const data = localStorage.getItem(`readingProgress_${currentSrc}`);
                if (!data) return;
                const progress = JSON.parse(data);
                if ((Date.now() - progress.timestamp) / (1000 * 60 * 60 * 24) > 7) return;
                setTimeout(() => {
                    try {
                        const iframeDoc = contentFrame.contentWindow.document;
                        iframeDoc.documentElement.scrollTop = progress.scrollPosition;
                        iframeDoc.body.scrollTop = progress.scrollPosition;
                    } catch (e) {}
                }, 500);
            } catch (e) {}
        }

        contentFrame.addEventListener('load', () => setTimeout(loadReadingProgress, 1000));
        setInterval(saveReadingProgress, 10000);
        window.addEventListener('beforeunload', saveReadingProgress);

        // ========== Preloading ==========
        window.addEventListener('load', () => {
            setTimeout(() => {
                const pagesToPreload = Object.keys(bookNames).filter(p => !loadedPages.has(p));
                let i = 0;
                function preloadNext() {
                    if (i >= pagesToPreload.length) return;
                    const src = pagesToPreload[i];
                    const link = document.createElement('link');
                    link.rel = 'prefetch';
                    link.href = src;
                    document.head.appendChild(link);
                    i++;
                    setTimeout(preloadNext, 500);
                }
                preloadNext();
            }, 2000);
        });

        // ========== Keyboard Shortcuts ==========
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
                e.preventDefault();
                searchInput.focus();
                searchInput.select();
            }
            if (e.key === 'Escape') {
                if (panelState > 0) { setPanelState(0); return; }
                if (searchResultsEl.classList.contains('visible')) window._closeSearch();
                fontPopover.classList.remove('visible');
            }
        });

    })();
    </script>
    <script>
    if ('serviceWorker' in navigator) {
        caches.keys().then(names => {
            names.forEach(name => {
                if (name !== 'vedabase-v3.0.0') caches.delete(name);
            });
        });
        navigator.serviceWorker.register('./sw.js');
    }
    </script>
